# Builds the art, runs every check, and deploys main to GitHub Pages.
# Pages must be on once: Settings > Pages > Source: GitHub Actions.
name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python tools
        run: pip install numpy pillow

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Generated art
        run: npm run assets
      - name: Map checks
        run: mkdir -p build/map && python3 tests/check_map.py build/map

      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - run: npm run build

      - name: Play tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
